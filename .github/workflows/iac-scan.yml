name: IaC scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checkov:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Checkov (pinned)
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install checkov==3.4.3

      - name: Scan the Terraform
        run: /tmp/venv/bin/checkov -d . --framework terraform --compact --quiet

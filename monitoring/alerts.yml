groups:
  - name: votesecure
    rules:
      - alert: HighMemoryUsage
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Memory usage is above 85 percent"
      - alert: ContainerNotRunning
        expr: engine_daemon_container_states_containers{state="running"} < 8
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Fewer than 8 containers are running"
